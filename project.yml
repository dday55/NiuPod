name: NiuPod
options:
  bundleIdPrefix: com.niupod
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SDKROOT: iphoneos
    GENERATE_INFOPLIST_FILE: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_PREVIEWS: "YES"
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  NiuPod:
    type: application
    platform: iOS
    sources:
      - path: NiuPod
        excludes:
          - "Info.plist"
      # 注意：本机 xcodegen 2.45.4 会忽略 target 的 resources 键，
      # asset catalog 必须以 folder reference 形式从 sources 引入，
      # 否则 appiconset 会被拆成散文件，actool 不会编译成 Assets.car
      - path: Assets.xcassets
        type: folder
    settings:
      base:
        PRODUCT_NAME: NiuPod
        INFOPLIST_FILE: NiuPod/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.niupod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # 团队 ID 不入库：由 scripts/generate.sh 从本地 .niupod-team 注入。
        # 首次构建前运行 ./scripts/set-team.sh <你的TeamID> 即可，详见 README。
        DEVELOPMENT_TEAM: ${NIUPOD_TEAM_ID}
    scheme:
      testTargets:
        - NiuPodTests
        - NiuPodUITests
      gatherCoverageData: false

  NiuPodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NiuPodTests
    dependencies:
      - target: NiuPod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niupod.tests
        CODE_SIGN_STYLE: Automatic
        # 团队 ID 不入库：由 scripts/generate.sh 从本地 .niupod-team 注入。
        # 首次构建前运行 ./scripts/set-team.sh <你的TeamID> 即可，详见 README。
        DEVELOPMENT_TEAM: ${NIUPOD_TEAM_ID}
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NiuPod.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NiuPod"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NiuPodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NiuPodUITests
    dependencies:
      - target: NiuPod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niupod.uitests
        CODE_SIGN_STYLE: Automatic
        # 团队 ID 不入库：由 scripts/generate.sh 从本地 .niupod-team 注入。
        # 首次构建前运行 ./scripts/set-team.sh <你的TeamID> 即可，详见 README。
        DEVELOPMENT_TEAM: ${NIUPOD_TEAM_ID}
        TEST_TARGET_NAME: NiuPod
